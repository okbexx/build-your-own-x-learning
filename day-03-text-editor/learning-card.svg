<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#e8eef7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9aa8bd" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="70" width="1460" height="760" rx="36" fill="#ffffff" stroke="#d5deea" stroke-width="3" filter="url(#shadow)"/>
  <text x="130" y="110" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#3460dc">BUILD YOUR OWN X · DAY 03</text>
  <text x="130" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="60" font-weight="700" fill="#182030">Text Editor 原理理解卡</text>
  <text x="130" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" fill="#4a5568">核心不是“打字”，而是把编辑意图映射到缓冲区、光标、渲染与保存。</text>

  <rect x="120" y="150" width="780" height="630" rx="28" fill="#f8fafc" stroke="#dee4ec" stroke-width="2"/>
  <rect x="960" y="150" width="520" height="630" rx="28" fill="#fafbfd" stroke="#dee4ec" stroke-width="2"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="145" y="247" width="730" height="84" rx="18" fill="#ffffff" stroke="#e6ebf2"/>
    <text x="165" y="276" font-size="28" font-weight="700" fill="#1c2538">1. 文本缓冲区</text>
    <text x="185" y="308" font-size="24" fill="#556070">文件先进入内存结构；插入删除性能取决于 array、gap</text>
    <text x="185" y="336" font-size="24" fill="#556070">buffer、rope、piece table 等设计。</text>

    <rect x="145" y="355" width="730" height="84" rx="18" fill="#ffffff" stroke="#e6ebf2"/>
    <text x="165" y="384" font-size="28" font-weight="700" fill="#1c2538">2. 光标映射</text>
    <text x="185" y="416" font-size="24" fill="#556070">用户看到的是行列位置；系统维护逻辑坐标、显示坐标</text>
    <text x="185" y="444" font-size="24" fill="#556070">与滚动偏移之间的映射。</text>

    <rect x="145" y="463" width="730" height="84" rx="18" fill="#ffffff" stroke="#e6ebf2"/>
    <text x="165" y="492" font-size="28" font-weight="700" fill="#1c2538">3. 屏幕刷新</text>
    <text x="185" y="524" font-size="24" fill="#556070">最小实现可整屏重绘；更高阶实现会做局部刷新、缓存</text>
    <text x="185" y="552" font-size="24" fill="#556070">与高亮分层。</text>

    <rect x="145" y="571" width="730" height="84" rx="18" fill="#ffffff" stroke="#e6ebf2"/>
    <text x="165" y="600" font-size="28" font-weight="700" fill="#1c2538">4. 输入事件</text>
    <text x="185" y="632" font-size="24" fill="#556070">方向键、退格、组合键、ESC 序列都要先解码，再变成</text>
    <text x="185" y="660" font-size="24" fill="#556070">move / insert / delete / save 命令。</text>

    <rect x="145" y="679" width="730" height="84" rx="18" fill="#ffffff" stroke="#e6ebf2"/>
    <text x="165" y="708" font-size="28" font-weight="700" fill="#1c2538">5. 保存一致性</text>
    <text x="185" y="740" font-size="24" fill="#556070">写盘不仅是输出文本，还涉及覆盖策略、异常中断保护、</text>
    <text x="185" y="768" font-size="24" fill="#556070">编码与换行规则。</text>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="995" y="200" font-size="34" font-weight="700" fill="#1a2234">编辑器最小心智模型</text>
    <rect x="995" y="260" width="440" height="70" rx="20" fill="#e9f0ff" stroke="#3460dc" stroke-width="3"/>
    <text x="1110" y="304" font-size="28" font-weight="700" fill="#1e263a">Keyboard Input</text>
    <line x1="1215" y1="340" x2="1215" y2="350" stroke="#3460dc" stroke-width="6"/>
    <polygon points="1205,350 1225,350 1215,366" fill="#3460dc"/>

    <rect x="995" y="370" width="440" height="70" rx="20" fill="#ecf9f2" stroke="#26a65b" stroke-width="3"/>
    <text x="1130" y="414" font-size="28" font-weight="700" fill="#1e263a">Event Decoder</text>
    <line x1="1215" y1="450" x2="1215" y2="460" stroke="#26a65b" stroke-width="6"/>
    <polygon points="1205,460 1225,460 1215,476" fill="#26a65b"/>

    <rect x="995" y="480" width="440" height="70" rx="20" fill="#fff4e5" stroke="#d77816" stroke-width="3"/>
    <text x="1080" y="524" font-size="28" font-weight="700" fill="#1e263a">Text Buffer + Cursor</text>
    <line x1="1215" y1="560" x2="1215" y2="570" stroke="#d77816" stroke-width="6"/>
    <polygon points="1205,570 1225,570 1215,586" fill="#d77816"/>

    <rect x="995" y="590" width="440" height="70" rx="20" fill="#f3efff" stroke="#744ac9" stroke-width="3"/>
    <text x="1115" y="634" font-size="28" font-weight="700" fill="#1e263a">Screen Renderer</text>
    <line x1="1215" y1="670" x2="1215" y2="680" stroke="#744ac9" stroke-width="6"/>
    <polygon points="1205,680 1225,680 1215,696" fill="#744ac9"/>

    <rect x="995" y="700" width="440" height="60" rx="20" fill="#ffeef1" stroke="#cc3c5a" stroke-width="3"/>
    <text x="1170" y="739" font-size="28" font-weight="700" fill="#1e263a">File Save</text>
  </g>

  <text x="130" y="815" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#5c6778">关键词：buffer / cursor / render / event loop / persistence</text>
</svg>